<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>skydo</title>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  /* palette di dataday */
  :root {
    --bg: #ECEEF7; --surface: rgba(255,255,255,.68); --primary: #3252CC; --primary-dark: #2040A8;
    --accent: #C83640; --text: #1C2040; --muted: #7274A4;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 16px; font-family: 'Sky Text', sans-serif; color: var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(50,82,204,.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(200,54,64,.10), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(238,114,69,.08), transparent 50%),
      radial-gradient(circle at 100% 70%, rgba(0,124,194,.10), transparent 45%),
      var(--bg);
  }
  .card {
    width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 24px;
    background: var(--surface); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 12px 48px rgba(50,82,204,.15);
  }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-bottom: 6px; }
  h1 span {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 18px; margin-bottom: 22px; }
  .sub b { color: var(--text); }
  input {
    width: 100%; font: inherit; font-size: 22px; padding: 16px 18px; border-radius: 16px;
    border: 2px solid rgba(50,82,204,.15); background: #fff; color: var(--text); outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--primary); }
  input::placeholder { color: var(--muted); opacity: .6; }
  button {
    width: 100%; margin-top: 14px; font: inherit; font-size: 22px; font-weight: 700; letter-spacing: 1px;
    padding: 16px; border: none; border-radius: 50px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 4px 24px rgba(50,82,204,.35); transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .status { min-height: 24px; margin-top: 16px; text-align: center; font-weight: 700; }
  .ok { color: var(--primary); } .err { color: var(--accent); }
  .link { margin-top: 18px; text-align: center; font-size: 14px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>sky<span>do</span></h1>

  <div id="join">
    <p class="sub">Come ti chiami?</p>
    <form id="joinForm">
      <input id="name" maxlength="30" autocomplete="nickname" placeholder="Il tuo nome" required>
      <button>Entra</button>
    </form>
  </div>

  <div id="play" class="hidden">
    <p class="sub">Ciao <b id="who"></b>, scrivi la risposta!</p>
    <form id="answerForm">
      <input id="answer" maxlength="200" autocomplete="off" placeholder="Risposta" required>
      <button id="send">Invia</button>
    </form>
    <p class="link" id="rename">Non sei tu? Cambia nome</p>
  </div>

  <p class="status" id="status"></p>
</div>

<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  let id = store.get("skydo-id");
  if (!id) { id = Math.random().toString(36).slice(2, 10); store.set("skydo-id", id); }
  let name = store.get("skydo-name");

  function status(text, cls) { $("status").textContent = text; $("status").className = "status " + (cls || ""); }

  // risponde {ok, error, domanda}; error = name_taken | not_started | already_answered | network
  async function publish(payload, who = name) {
    try {
      const resp = await fetch(SERVER + "/msg", { method: "POST", body: JSON.stringify({ id, name: who, ...payload }) });
      const data = await resp.json().catch(() => ({}));
      return resp.ok ? { ok: true, ...data } : { ok: false, error: data.error || "network", ...data };
    } catch { return { ok: false, error: "network" }; }
  }

  function showJoin(message) {
    $("play").classList.add("hidden");
    $("join").classList.remove("hidden");
    $("name").value = name || "";
    $("name").focus();
    status(message || "", "err");
  }

  function showPlay() {
    $("join").classList.add("hidden");
    $("play").classList.remove("hidden");
    $("who").textContent = name;
    $("answer").focus();
  }

  const NAME_TAKEN = "Questo nome è già usato da un altro giocatore, scegline un altro";

  $("joinForm").onsubmit = async (e) => {
    e.preventDefault();
    const candidate = $("name").value.trim();
    if (!candidate) return;
    status("Entro…");
    const result = await publish({ type: "join" }, candidate);
    if (!result.ok) return status(result.error === "name_taken" ? NAME_TAKEN : "Connessione non riuscita, riprova", "err");
    name = candidate;
    store.set("skydo-name", name);
    status("");
    showPlay();
  };

  $("answerForm").onsubmit = async (e) => {
    e.preventDefault();
    const answer = $("answer").value.trim();
    if (!answer) return;
    $("send").disabled = true;
    status("Invio…");
    const result = await publish({ type: "answer", answer });
    $("send").disabled = false;
    if (result.ok) {
      $("answer").value = "";
      status(`Risposta alla domanda ${result.domanda} inviata: ${answer}`, "ok");
    } else if (result.error === "already_answered") {
      status(`Hai già risposto alla domanda ${result.domanda}`, "err");
    } else if (result.error === "not_started") {
      status("La domanda non è ancora partita, aspetta il via", "err");
    } else if (result.error === "name_taken") {
      showJoin(NAME_TAKEN);
    } else {
      status("Invio non riuscito, riprova", "err");
    }
    $("answer").focus();
  };

  $("rename").onclick = () => showJoin();

  if (name) {
    showPlay();
    // si ripresenta al conduttore (es. dopo un reset); se nel frattempo il nome è stato preso, ne chiede un altro
    publish({ type: "join" }).then((result) => { if (result.error === "name_taken") showJoin(NAME_TAKEN); });
  }
</script>
</body>
</html>
