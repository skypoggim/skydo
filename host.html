<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skydo · conduttore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Sky Text'; src: url('assets/fonts/Sky-Text-Bold.ttf') format('truetype'); font-weight: 700 900; }
  :root {
    --bg: #ECEEF7; --surface: rgba(255,255,255,.72); --primary: #3252CC; --primary-dark: #2040A8;
    --accent: #C83640; --gold: #B8720A; --ok: #1E8E5A; --text: #1C2040; --muted: #7274A4;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100dvh; padding: 16px; font-family: 'Sky Text', sans-serif; color: var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(50,82,204,.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(200,54,64,.10), transparent 40%),
      radial-gradient(circle at 100% 70%, rgba(0,124,194,.10), transparent 45%),
      var(--bg);
  }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card {
    padding: 22px; border-radius: 22px; background: var(--surface); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 12px 48px rgba(50,82,204,.12);
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
  h1 span {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 small { font-size: 16px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; }
  .muted { color: var(--muted); }
  .server { font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .server::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .server.ready::before { background: var(--ok); box-shadow: 0 0 0 4px rgba(30,142,90,.15); }
  input[type=password] {
    width: 100%; font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 14px;
    border: 2px solid rgba(50,82,204,.15); background: #fff; color: var(--text); outline: none;
  }
  input:focus { border-color: var(--primary); }
  button {
    font: inherit; font-weight: 700; border: none; border-radius: 50px; cursor: pointer;
    padding: 12px 20px; font-size: 16px; color: var(--primary); background: rgba(50,82,204,.1);
    transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.main {
    width: 100%; padding: 20px; font-size: 24px; letter-spacing: 1px; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 4px 24px rgba(50,82,204,.35);
  }
  button.danger { color: var(--accent); background: rgba(200,54,64,.1); }
  #game { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar button { padding: 10px 18px; font-size: 15px; }
  .stats { display: flex; gap: 24px; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
  .question { white-space: pre-wrap; font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(50,82,204,.1); }
  .question.idle { font-weight: 400; color: var(--muted); font-size: 18px; }
  .options { list-style: none; padding: 0; margin-top: 10px; display: grid; gap: 6px; }
  .options:empty { display: none; }
  .options { grid-template-columns: 1fr 1fr; }
  .options li { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: rgba(50,82,204,.06); font-size: 17px; }
  .options li b { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 8px; background: #fff; font-size: 14px; }
  .options li.right { background: rgba(30,142,90,.12); color: var(--ok); font-weight: 700; }
  .options li.right b { background: var(--ok); color: #fff; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 50px; background: rgba(50,82,204,.08); }
  .tabs button { padding: 8px 18px; font-size: 15px; background: transparent; }
  .tabs button.active { background: #fff; box-shadow: 0 2px 8px rgba(50,82,204,.15); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 16px; }
  td, th { padding: 10px 8px; text-align: left; vertical-align: middle; border-bottom: 1px solid rgba(50,82,204,.08); }
  th { font-size: 12px; color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }
  tbody tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .answer { overflow-wrap: anywhere; }
  .mark { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  tr.yes .mark { background: var(--ok); }
  tr.no .mark { background: var(--accent); opacity: .55; }
  tr.no td:not(:first-child) { color: var(--muted); }
  tr.first td { font-weight: 700; background: rgba(184,114,10,.08); }
  .badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 50px; font-size: 12px; font-weight: 700;
    letter-spacing: .5px; color: var(--gold); background: rgba(184,114,10,.14); vertical-align: 2px; }
  .pos { color: var(--muted); font-weight: 700; }
  tr.podium .pos { color: var(--primary); }
  tr.podium:first-child td { font-weight: 700; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  /* larghezze colonne (table-layout fixed: la colonna senza larghezza prende il resto) */
  .c-mark { width: 34px; } .c-pos { width: 44px; } .c-live-name { width: 38%; }
  .c-sec { width: 64px; } .c-pts { width: 76px; } .c-ok { width: 72px; }
  @media (max-width: 560px) {
    .card { padding: 18px 16px; }
    .options { grid-template-columns: 1fr; }
    td, th { padding: 10px 5px; } td { font-size: 15px; }
    .c-mark { width: 20px; } .c-pos { width: 30px; } .c-live-name { width: 44%; } .c-pts { width: 54px; } .c-ok { width: 56px; }
    .hide-sm { display: none; }
  }
  .error { color: var(--accent); font-weight: 700; min-height: 1em; margin-top: 10px; }
  .hidden { display: none !important; }
  #qrModal {
    position: fixed; inset: 0; background: rgba(28,32,64,.55); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #qrModal .card { background: #fff; text-align: center; max-width: 520px; width: 100%; }
  #qrCanvas { width: 100%; max-width: 420px; height: auto; }
  #qrUrl { word-break: break-all; font-size: 14px; margin: 10px 0 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>sky<span>do</span> <small>conduttore</small></h1>
    <span class="server muted" id="serverStatus">Sveglio il server…</span>
  </header>

  <!-- Accesso -->
  <section class="card hidden" id="login">
    <h2>Accesso conduttore</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Chiave (HOST_KEY)" autocomplete="current-password" required>
      <div style="margin-top:14px"><button class="main">Entra</button></div>
    </form>
    <p class="error" id="loginError"></p>
  </section>

  <!-- Partita -->
  <section class="hidden" id="game">
    <div class="card">
      <div class="toolbar">
        <div class="stats">
          <div class="stat"><b id="playersStat">0</b><span id="playersLabel">giocatori</span></div>
          <div class="stat"><b id="questionStat">0/0</b><span>domanda</span></div>
        </div>
        <div class="row">
          <button id="showQr">QR</button>
          <button id="csv">CSV</button>
          <button class="danger" id="reset">Reset</button>
        </div>
      </div>
      <p class="question" id="questionText"></p>
      <ol class="options" id="options"></ol>
      <p class="error" id="gameError"></p>
      <div style="margin-top:14px"><button class="main" id="next" disabled>Avvia domanda 1</button></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="active" data-tab="live">Live</button>
        <button data-tab="board">Classifica</button>
      </div>
      <div id="live"></div>
      <div id="board" class="hidden"></div>
    </div>
  </section>
</main>

<div id="qrModal" class="hidden">
  <div class="card">
    <h2>Inquadra per giocare</h2>
    <canvas id="qrCanvas"></canvas>
    <p id="qrUrl" class="muted"></p>
    <div class="row" style="justify-content:center">
      <button id="qrDownload">Scarica PNG</button>
      <button id="qrClose">Chiudi</button>
    </div>
  </div>
</div>

<script>
  const SERVER = "https://skydo.onrender.com";  // URL di server.py su Render
  const PLAYER_URL = new URL("./", location.href).href;  // index.html, stessa cartella
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  let key = store.get("skydo-host-key");
  let quiz = [];
  let state = freshState();
  let epoch = null;
  let pollBusy = false;

  function freshState() {
    return { since: 0, n: 0, players: {}, answers: [] };
  }

  // ---------- server ----------
  async function post(path, body) {
    const resp = await fetch(SERVER + path, { method: "POST", body: JSON.stringify(body) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw Object.assign(new Error(data.error || "errore " + resp.status), { status: resp.status });
    return data;
  }

  async function wakeServer() {
    for (let attempt = 0; attempt < 30; attempt++) {
      try {
        if ((await fetch(SERVER + "/")).ok) { $("serverStatus").textContent = "server pronto"; $("serverStatus").classList.add("ready"); return true; }
      } catch {}
      $("serverStatus").textContent = `Sveglio il server… (${(attempt + 1) * 5}s)`;
      await new Promise((resolve) => setTimeout(resolve, 5000));
    }
    $("serverStatus").textContent = "Server non raggiungibile: ricarica la pagina";
    return false;
  }

  async function poll() {
    if (pollBusy || !key) return;
    pollBusy = true;
    try {
      const resp = await fetch(`${SERVER}/msg?since=${state.since}&key=${encodeURIComponent(key)}`);
      if (resp.status === 403) { logout("Chiave non più valida"); return; }
      if (!resp.ok) return;
      const data = await resp.json();
      if (epoch !== null && data.epoch !== epoch) {
        // server riavviato (o reset da un altro dispositivo): la numerazione riparte, la partita in corso resta
        state.since = 0;
        $("gameError").textContent = "Il server si è riavviato: continuo con le risposte già ricevute.";
        loadQuiz();
      }
      epoch = data.epoch;
      data.messages.forEach(handle);
      if (data.messages.length) render();
    } catch {} finally { pollBusy = false; }
  }

  function handle(event) {
    if (event.seq <= state.since) return;
    state.since = event.seq;
    let payload;
    try { payload = JSON.parse(event.message); } catch { return; }
    if (payload.type === "question") { state.n = payload.domanda || state.n + 1; return; }
    const id = String(payload.id || "?");
    state.players[id] = String(payload.name || "?");
    if (payload.type !== "answer") return;
    // correttezza, secondi e punti li calcola il server (stessi numeri che vedono i telefoni)
    state.answers.push({
      domanda: payload.domanda, nome: state.players[id], risposta: payload.answer, corretta: payload.corretta,
      secondi: Number(payload.secondi) || 0, punti: Number(payload.punti) || 0, primo: !!payload.primo, ts: new Date(event.time * 1000).toISOString(), id,
    });
  }

  // ---------- render ----------
  // columns: [{label, cls, col}], col = classe CSS della larghezza; ogni cella è testo o un nodo DOM, con la classe della sua colonna
  function table(columns, rows, emptyText) {
    if (!rows.length) return Object.assign(document.createElement("p"), { className: "empty", textContent: emptyText });
    const element = document.createElement("table");
    const colgroup = element.appendChild(document.createElement("colgroup"));
    columns.forEach(({ col, cls }) => { colgroup.appendChild(document.createElement("col")).className = [col, (cls || "").includes("hide-sm") ? "hide-sm" : ""].join(" "); });
    const head = element.createTHead().insertRow();
    columns.forEach(({ label, cls }) => head.appendChild(Object.assign(document.createElement("th"), { textContent: label, className: cls || "" })));
    const body = element.createTBody();
    rows.forEach(({ cells, cls }) => {
      const row = body.insertRow();
      if (cls) row.className = cls;
      cells.forEach((content, i) => {
        const td = row.insertCell();
        td.className = columns[i].cls || "";
        if (content instanceof Node) td.appendChild(content); else td.textContent = content;
      });
    });
    return element;
  }

  function nameCell(name, first) {
    const span = Object.assign(document.createElement("span"), { textContent: name });
    if (first) span.appendChild(Object.assign(document.createElement("span"), { className: "badge", textContent: "1°" }));
    return span;
  }

  function leaderboard() {
    const scores = {};
    Object.entries(state.players).forEach(([id, nome]) => { scores[id] = { nome, punti: 0, giuste: 0, secondi: 0 }; });
    state.answers.filter((answer) => answer.corretta).forEach((answer) => {
      const score = scores[answer.id];
      score.punti += answer.punti;
      score.giuste += 1;
      score.secondi += answer.secondi;
    });
    return Object.values(scores).sort((a, b) => b.punti - a.punti || a.secondi - b.secondi);
  }

  // "B" -> "B · 2003" per le domande a scelta multipla
  function optionLabel(answer) {
    const options = (quiz[answer.domanda - 1] || {}).opzioni || [];
    const index = String(answer.risposta || "").trim().toUpperCase().charCodeAt(0) - 65;
    return String(answer.risposta).trim().length === 1 && options[index] ? `${answer.risposta} · ${options[index]}` : answer.risposta;
  }

  function render() {
    const total = quiz.length;
    const players = Object.keys(state.players).length;
    $("playersStat").textContent = players;
    $("playersLabel").textContent = players === 1 ? "giocatore" : "giocatori";
    $("questionStat").textContent = `${state.n}/${total}`;
    $("questionText").textContent = state.n
      ? (quiz[state.n - 1] || {}).domanda || ""
      : "Mostra il QR e aspetta che i giocatori entrino.";
    $("questionText").classList.toggle("idle", !state.n);
    // opzioni con lettera, la giusta in verde (solo qui, i telefoni vedono solo A/B/C/D)
    const question = quiz[state.n - 1] || {};
    const right = (question.risposte || []).map((answer) => String(answer).trim().toUpperCase());
    $("options").replaceChildren(...(question.opzioni || []).map((option, i) => {
      const letter = String.fromCharCode(65 + i);
      const item = Object.assign(document.createElement("li"), { className: right.includes(letter) ? "right" : "" });
      item.append(Object.assign(document.createElement("b"), { textContent: letter }), option);
      return item;
    }));

    const next = $("next");
    if (!next.dataset.busy) {
      next.disabled = state.n >= total;
      next.textContent = state.n >= total ? "Domande finite" : `Avvia domanda ${state.n + 1}`;
    }

    const current = state.answers.filter((answer) => answer.domanda === state.n);
    $("live").replaceChildren(table([
      { label: "", col: "c-mark" }, { label: "Nome", cls: "name", col: "c-live-name" }, { label: "Risposta", cls: "answer" },
      { label: "Sec", cls: "num hide-sm", col: "c-sec" }, { label: "Punti", cls: "num", col: "c-pts" },
    ], current.map((answer) => ({
      cls: (answer.corretta ? "yes" : "no") + (answer.primo ? " first" : ""),
      cells: [Object.assign(document.createElement("span"), { className: "mark" }), nameCell(answer.nome, answer.primo),
              optionLabel(answer), answer.secondi.toFixed(1), answer.punti],
    })), state.n ? "Ancora nessuna risposta a questa domanda." : "Le risposte appariranno qui."));

    $("board").replaceChildren(table([
      { label: "#", cls: "pos", col: "c-pos" }, { label: "Nome", cls: "name" }, { label: "Punti", cls: "num", col: "c-pts" },
      { label: "Giuste", cls: "num", col: "c-ok" }, { label: "Sec", cls: "num hide-sm", col: "c-sec" },
    ], leaderboard().map((score, i) => ({
      cls: i < 3 && score.punti ? "podium" : "",
      cells: [i + 1, score.nome, score.punti, score.giuste, score.secondi.toFixed(1)],
    })), "Nessun giocatore ancora."));
  }

  // ---------- QR / download ----------
  function drawQr() {
    const qr = qrcode(0, "M");
    qr.addData(PLAYER_URL);
    qr.make();
    const count = qr.getModuleCount(), size = 20, margin = 2;
    const canvas = $("qrCanvas");
    canvas.width = canvas.height = (count + margin * 2) * size;
    const context = canvas.getContext("2d");
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "#1C2040";
    for (let r = 0; r < count; r++)
      for (let c = 0; c < count; c++)
        if (qr.isDark(r, c)) context.fillRect((c + margin) * size, (r + margin) * size, size, size);
    $("qrUrl").textContent = PLAYER_URL;
  }

  function download(name, href) {
    const link = Object.assign(document.createElement("a"), { href, download: name });
    document.body.appendChild(link); link.click(); link.remove();
  }

  // ---------- flusso ----------
  function logout(message) {
    key = null;
    store.set("skydo-host-key", "");
    $("game").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginError").textContent = message || "";
  }

  async function enter() {
    $("login").classList.add("hidden");
    $("game").classList.remove("hidden");
    await loadQuiz();
    render();
    poll();
  }

  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    $("loginError").textContent = "";
    try {
      await post("/login", { key: $("password").value });
      key = $("password").value;
      store.set("skydo-host-key", key);
      enter();
    } catch (error) { $("loginError").textContent = error.status === 403 ? error.message : "Server non raggiungibile, riprova"; }
  };

  $("next").onclick = async () => {
    // opzioni con lettera, la giusta in verde (solo qui, i telefoni vedono solo A/B/C/D)
    const question = quiz[state.n - 1] || {};
    const right = (question.risposte || []).map((answer) => String(answer).trim().toUpperCase());
    $("options").replaceChildren(...(question.opzioni || []).map((option, i) => {
      const letter = String.fromCharCode(65 + i);
      const item = Object.assign(document.createElement("li"), { className: right.includes(letter) ? "right" : "" });
      item.append(Object.assign(document.createElement("b"), { textContent: letter }), option);
      return item;
    }));

    const next = $("next");
    next.dataset.busy = "1";
    next.disabled = true;
    next.textContent = "…";
    try {
      await post("/question", { key, n: state.n + 1 });
      while (pollBusy) await new Promise((resolve) => setTimeout(resolve, 50));
      await poll();
    } catch (error) { $("gameError").textContent = "Domanda non partita: " + error.message; }
    delete next.dataset.busy;
    render();
  };

  $("reset").onclick = async () => {
    if (!confirm("Azzerare la partita? Risposte e classifica verranno cancellate (scarica prima il CSV se ti serve).")) return;
    try {
      while (pollBusy) await new Promise((resolve) => setTimeout(resolve, 50));
      pollBusy = true;
      epoch = (await post("/reset", { key })).epoch;
      state = freshState();
      $("gameError").textContent = "";
      await loadQuiz();
    } catch (error) { $("gameError").textContent = "Reset non riuscito: " + error.message; }
    pollBusy = false;
    render();
  };

  $("csv").onclick = () => {
    const columns = ["domanda", "nome", "risposta", "corretta", "secondi", "punti", "ts", "id"];
    const quote = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const lines = [columns.join(","), ...state.answers.map((answer) => columns.map((column) => quote(answer[column])).join(","))];
    const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
    download(`skydo_${stamp}.csv`, URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })));
  };

  $("showQr").onclick = () => $("qrModal").classList.remove("hidden");
  $("qrClose").onclick = () => $("qrModal").classList.add("hidden");
  $("qrDownload").onclick = () => download("skydo_qr.png", $("qrCanvas").toDataURL("image/png"));

  document.querySelectorAll(".tabs button").forEach((button) => {
    button.onclick = () => {
      document.querySelectorAll(".tabs button").forEach((other) => other.classList.toggle("active", other === button));
      ["live", "board"].forEach((id) => $(id).classList.toggle("hidden", id !== button.dataset.tab));
    };
  });

  // le domande stanno solo sul server (Secret File di Render), lette con la chiave
  async function loadQuiz() {
    try {
      const resp = await fetch(`${SERVER}/quiz?key=${encodeURIComponent(key)}`);
      if (!resp.ok) throw new Error();
      quiz = (await resp.json()).quiz;
      if (!quiz.length) $("gameError").textContent = "Nessuna domanda sul server: carica quiz.json come Secret File su Render";
    } catch { $("gameError").textContent = "Domande non lette dal server, ricarica la pagina"; }
    render();
  }

  (async () => {
    drawQr();
    if (!(await wakeServer())) return;
    if (key) enter(); else logout();
    setInterval(poll, 500);
  })();
</script>
</body>
</html>
